# Node.js (from .nvmrc unless a version is given), Yarn through Corepack, and the workspace installed
# from yarn.lock. Yarn's cache lives in .yarn/cache (YARN_ENABLE_GLOBAL_CACHE=false) so
# actions/cache can keep it between runs.
name: Set up the workspace
description: Install Node.js, Yarn and the workspace dependencies.
inputs:
  node-version:
    description: Node.js version; defaults to .nvmrc.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
    - name: Enable Corepack
      shell: bash
      run: |
        npm install --global corepack
        corepack enable
    - uses: actions/cache@v4
      with:
        path: .yarn/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - name: Install
      shell: bash
      env:
        YARN_ENABLE_GLOBAL_CACHE: 'false'
      run: yarn install --immutable
