# Dynamic Lab pipeline
#
# A Turborepo monorepo: packages/dynamic-lab (the library), packages/the-lab-sans (the font) and
# apps/landing, apps/showcase, apps/playground, apps/docs, apps/the-lab-sans.
#
# Releases go through Changesets (see .changeset/README.md):
#
# 1. Every merge request that changes a published package adds a changeset (`yarn changeset`).
# 2. On each push to main, version-mr gathers the changesets into a "Version Packages" merge request
#    that bumps the versions and writes the changelogs (changesets-gitlab, with GITLAB_TOKEN).
# 3. Merging that merge request changes the packages' versions, which starts the release jobs, once,
#    for every package that moved:
#    - plan lists the versions that have no tag yet (scripts/pending-releases.mjs)
#    - typecheck and build every workspace on each Node version in the NODE_VERSION matrix
#    - publish each pending package to this project's package registry and to npmjs.org
#    - create a GitLab release, and with it the tag, for each one:
#        v1.2.3                 @furlab/dynamic-lab
#        the-lab-sans-v1.2.3    @furlab/the-lab-sans
#    - build the landing page, showcase, playground, docs and The Lab Sans specimen into public/
#      and deploy them to GitLab Pages, so the published docs match the release
#
# Tags don't start pipelines (the release creates them), so one release is one pipeline however
# many packages it ships. Other pushes to main only run version-mr.
#
# Merge requests get a pipeline of their own (the mr: jobs): typecheck, build, lint and format on
# Node 24, a check that a change to a published package comes with a changeset, and a comment from
# changesets-gitlab saying what the merge request will release.
#
# Publishing to npmjs.org uses trusted publishing (OIDC), not a token: each package needs a trusted
# publisher on npmjs.com for this project and .gitlab-ci.yml (GitLab.com shared runners only). The
# npm jobs get an NPM_ID_TOKEN for it; when npm refuses it (no trusted publisher yet) they exit with
# code 78 and are allowed to fail, and everything else still runs. Only this GitLab project
# publishes: the GitHub mirror's workflow builds and creates GitHub releases, nothing more.
#
# Keep the NODE_VERSION matrix in sync with .github/workflows/release.yml.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Run pipeline (Build > Pipelines > Run pipeline), e.g. to retry a release.
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  # Jobs run on the project's own runners (the `furlab` tag), except npm publishing (.npm-registry).
  tags:
    - furlab
  image: node:${NODE_VERSION}
  before_script:
    - npm install -g corepack
    - corepack enable
    - yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
      - .turbo/cache

variables:
  # The Node version for jobs outside the matrix (publishing, Pages). Matches .nvmrc.
  NODE_VERSION: '24'
  # Keep Yarn's cache inside the project so the CI cache above can save it.
  YARN_ENABLE_GLOBAL_CACHE: 'false'
  # Turborepo's local cache, also saved by the CI cache.
  TURBO_CACHE_DIR: .turbo/cache

stages:
  - check
  - build
  - publish
  - release
  - deploy

.node-matrix:
  parallel:
    matrix:
      - NODE_VERSION: ['22', '24', '26']

# The release jobs run when a push to main changes a published package's version (merging the
# "Version Packages" merge request), or when a pipeline is started by hand.
.release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - packages/dynamic-lab/package.json
        - packages/the-lab-sans/package.json

# ---------------------------------------------------------- Merge requests

.merge-request:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

mr:typecheck:
  stage: check
  extends: .merge-request
  script:
    - yarn typecheck

mr:lint:
  stage: check
  extends: .merge-request
  script:
    - yarn lint

mr:format:
  stage: check
  extends: .merge-request
  script:
    - yarn format

mr:build:
  stage: build
  extends: .merge-request
  script:
    - yarn build

# A change to a published package needs a changeset (yarn changeset). The Version Packages merge
# request is exempt (it consumes them), and so is a merge request labelled "no changeset", for a
# change that doesn't affect anyone using the package (tests, comments, internal tooling).
mr:changeset:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^changeset-release\//'
      when: never
    - if: '$CI_MERGE_REQUEST_LABELS =~ /(^|,)no changeset(,|$)/'
      when: never
    - when: on_success
  variables:
    GIT_DEPTH: '0'
  script:
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - yarn changeset status --since="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# Comments on the merge request with what it will release, or how to add a changeset.
mr:changeset-comment:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^changeset-release\//'
      when: never
    - when: on_success
  variables:
    GITLAB_COMMENT_TYPE: note
  script:
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "GITLAB_TOKEN isn't available to this pipeline, so there's no changeset comment."
        exit 78
      fi
    - yarn changesets-gitlab comment
  allow_failure:
    exit_codes: 78

# ---------------------------------------------------------------- Version

version-mr:
  stage: check
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  variables:
    INPUT_VERSION_SCRIPT: yarn version-packages
    INPUT_REMOVE_SOURCE_BRANCH: 'true'
  script:
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "GITLAB_TOKEN isn't set, so the Version Packages merge request can't be opened. Add a project access token (Developer, api and write_repository scopes) as a masked, protected CI/CD variable."
        exit 78
      fi
    - yarn changesets-gitlab
  # 78: no GITLAB_TOKEN yet. Any other failure still fails the job.
  allow_failure:
    exit_codes: 78

# ---------------------------------------------------------------- Release

plan:
  stage: check
  extends: .release
  before_script: []
  cache: []
  script:
    - node scripts/pending-releases.mjs --dotenv release.env
    - cat release.env
  artifacts:
    reports:
      dotenv: release.env

typecheck:
  stage: check
  extends: [.release, .node-matrix]
  script:
    - yarn typecheck

format:
  stage: check
  extends: .release
  script:
    - yarn format
  allow_failure: true

lint:
  stage: check
  extends: .release
  script:
    - yarn lint
  allow_failure: true

build:
  stage: build
  extends: [.release, .node-matrix]
  script:
    - yarn build
  artifacts:
    paths:
      - packages/dynamic-lab/dist/
      - packages/the-lab-sans/dist/
    expire_in: 1 week

# Each publish job does nothing unless plan found its package's tag missing.
.publish:
  stage: publish
  extends: .release
  # prepack builds the package, so these jobs only need plan's PENDING_TAGS.
  dependencies: [plan]
  script:
    - TAG="$TAG_PREFIX$(node -p "require('./$PACKAGE_DIR/package.json').version")"
    - |
      case ",$PENDING_TAGS," in
        *",$TAG,"*) ;;
        *) echo "$PACKAGE has nothing new to release ($TAG exists)."; exit 0 ;;
      esac
    - yarn workspace "$PACKAGE" release --registry "$REGISTRY" --skip-published

.dynamic-lab:
  variables:
    PACKAGE: '@furlab/dynamic-lab'
    PACKAGE_DIR: packages/dynamic-lab
    TAG_PREFIX: v

.the-lab-sans:
  variables:
    PACKAGE: '@furlab/the-lab-sans'
    PACKAGE_DIR: packages/the-lab-sans
    TAG_PREFIX: the-lab-sans-v

.gitlab-registry:
  variables:
    REGISTRY: gitlab

.npm-registry:
  variables:
    REGISTRY: npm
  # Trusted publishing: npm exchanges NPM_ID_TOKEN for a short-lived publish token, and signs
  # provenance with SIGSTORE_ID_TOKEN.
  id_tokens:
    NPM_ID_TOKEN:
      aud: 'npm:registry.npmjs.org'
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  # 78: no NPM_ID_TOKEN, or npm refused it (see scripts/release.mjs). Any other failure still fails the pipeline.
  allow_failure:
    exit_codes: 78
  # npm only trusts tokens from GitLab.com shared runners, so these jobs skip the default `furlab`
  # tag (keeping the other defaults). On a self-hosted runner npm would refuse the token and the
  # job would exit 78, which is allowed to fail: npm releases would stop without a red pipeline.
  inherit:
    default: [image, before_script, cache]

publish:dynamic-lab:gitlab:
  extends: [.publish, .dynamic-lab, .gitlab-registry]

publish:dynamic-lab:npm:
  extends: [.publish, .dynamic-lab, .npm-registry]

publish:the-lab-sans:gitlab:
  extends: [.publish, .the-lab-sans, .gitlab-registry]

publish:the-lab-sans:npm:
  extends: [.publish, .the-lab-sans, .npm-registry]

# Runs once the publish stage is done, so a release (and its tag) only appears for a package that
# made it to the GitLab registry. A skipped npm publish doesn't hold it up.
gitlab-release:
  stage: release
  extends: .release
  dependencies: [plan]
  before_script: []
  cache: []
  script:
    - |
      if [ -z "$PENDING_TAGS" ]; then
        echo "Nothing to release."
        exit 0
      fi
    - node scripts/gitlab-release.mjs "$PENDING_TAGS"

# -------------------------------------------------------------------- Pages

pages:
  stage: deploy
  extends: .release
  dependencies: []
  variables:
    VITE_REGISTRY_URL: '$CI_API_V4_URL/packages/npm/'
    VITE_REPOSITORY_URL: '$CI_PROJECT_URL'
  script:
    - yarn pages
  artifacts:
    paths:
      - public
  environment:
    name: docs
    url: $CI_PAGES_URL
