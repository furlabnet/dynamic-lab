# Dynamic Lab pipeline
#
# A Turborepo monorepo: packages/dynamic-lab (the library), packages/the-lab-sans (the font) and
# apps/landing, apps/showcase, apps/docs, apps/the-lab-sans.
#
# - every push and merge request: install, typecheck and build every workspace, on each Node
#                                  version in the NODE_VERSION matrix
# - release tags:                  publish the package to this project's package registry and to
#                                  npmjs.org, then create a GitLab release with the changelog
#     v1.2.3                 @furlab/dynamic-lab
#     the-lab-sans-v1.2.3    @furlab/the-lab-sans
# - the default branch:            build the landing page, showcase, docs and The Lab Sans specimen
#                                  into public/ and deploy them to GitLab Pages
#
# Releasing: bump "version" in the package's package.json, move its changelog's "Unreleased"
# section under a heading for the version, commit, then tag and push:
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag that looks like a release tag but isn't one (the-lab-sans-v1.2.3.beta.1, say) fails the
# release-tag job instead of quietly skipping the publish jobs.
#
# Publishing to npmjs.org uses trusted publishing (OIDC), not a token: each package needs a trusted
# publisher on npmjs.com for this project and .gitlab-ci.yml (GitLab.com shared runners only). The
# npm jobs get an NPM_ID_TOKEN for it; when npm refuses it (no trusted publisher yet) they exit with
# code 78 and are allowed to fail, and everything else still runs. Only this GitLab project publishes: the GitHub mirror's workflow
# builds and creates GitHub releases, nothing more.
#
# Keep the NODE_VERSION matrix in sync with .github/workflows/release.yml.

default:
  image: node:${NODE_VERSION}
  before_script:
    - npm install -g corepack
    - corepack enable
    - yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
      - .turbo/cache

variables:
  # The Node version for jobs outside the matrix (publishing, Pages). Matches .nvmrc.
  NODE_VERSION: '26'
  # Keep Yarn's cache inside the project so the CI cache above can save it.
  YARN_ENABLE_GLOBAL_CACHE: 'false'
  # Turborepo's local cache, also saved by the CI cache.
  TURBO_CACHE_DIR: .turbo/cache

stages:
  - check
  - build
  - publish
  - release
  - deploy

.node-matrix:
  parallel:
    matrix:
      - NODE_VERSION: ['22', '26']

.release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(the-lab-sans-)?v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

typecheck:
  stage: check
  extends: .node-matrix
  script:
    - yarn typecheck

release-tag:
  stage: check
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(the-lab-sans-)?v\d/'
  before_script: []
  cache: []
  script:
    - |
      node --input-type=module -e "
        import { readFileSync } from 'node:fs'
        import { releaseForTag } from './scripts/releases.mjs'
        const tag = process.env.CI_COMMIT_TAG
        const release = releaseForTag(tag)
        if (!release) {
          console.error(tag + ' is not a release tag, so nothing will be published. Use v1.2.3 or the-lab-sans-v1.2.3, with a hyphen before any pre-release (v1.2.3-beta.1).')
          process.exit(1)
        }
        const { version } = JSON.parse(readFileSync(release.dir + '/package.json', 'utf8'))
        if (version !== release.version) {
          console.error(release.name + ' is at ' + version + ' in package.json, but ' + tag + ' is for ' + release.version + '.')
          process.exit(1)
        }
        console.log(tag + ' releases ' + release.name + ' ' + version)
      "

format:
  stage: check
  script:
    - yarn format:check
  allow_failure: true

build:
  stage: build
  extends: .node-matrix
  script:
    - yarn build
  artifacts:
    paths:
      - packages/dynamic-lab/dist/
      - packages/the-lab-sans/dist/
    expire_in: 1 week

# ------------------------------------------------------------------ Publish

.publish:
  stage: publish
  # prepack builds the package, so these jobs don't need the build artifacts.
  dependencies: []
  script:
    - yarn workspace "$PACKAGE" release --registry "$REGISTRY"

.publish-npm:
  variables:
    REGISTRY: npm
  # Trusted publishing: npm exchanges NPM_ID_TOKEN for a short-lived publish token, and signs
  # provenance with SIGSTORE_ID_TOKEN.
  id_tokens:
    NPM_ID_TOKEN:
      aud: 'npm:registry.npmjs.org'
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  # 78: no NPM_ID_TOKEN, or npm refused it (see scripts/release.mjs). Any other failure still fails the pipeline.
  allow_failure:
    exit_codes: 78

publish:dynamic-lab:gitlab:
  extends: .publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  variables:
    PACKAGE: '@furlab/dynamic-lab'
    REGISTRY: gitlab

publish:dynamic-lab:npm:
  extends: [.publish, .publish-npm]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  variables:
    PACKAGE: '@furlab/dynamic-lab'

publish:the-lab-sans:gitlab:
  extends: .publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^the-lab-sans-v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  variables:
    PACKAGE: '@furlab/the-lab-sans'
    REGISTRY: gitlab

publish:the-lab-sans:npm:
  extends: [.publish, .publish-npm]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^the-lab-sans-v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  variables:
    PACKAGE: '@furlab/the-lab-sans'

release-notes:
  stage: publish
  extends: .release-tag
  dependencies: []
  before_script: []
  cache: []
  script:
    - node scripts/release-notes.mjs "$CI_COMMIT_TAG" > release-notes.md
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 1 week

# Runs once the publish stage is done, so a release only appears for a package that made it to the
# GitLab registry. (A skipped npm publish doesn't hold it up.)
gitlab-release:
  stage: release
  extends: .release-tag
  image: registry.gitlab.com/gitlab-org/cli:latest
  dependencies: [release-notes]
  before_script: []
  cache: []
  script:
    - echo "Creating the GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md

# -------------------------------------------------------------------- Pages

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  dependencies: []
  variables:
    VITE_REGISTRY_URL: '$CI_API_V4_URL/packages/npm/'
    VITE_REPOSITORY_URL: '$CI_PROJECT_URL'
  script:
    - yarn pages
  artifacts:
    paths:
      - public
  environment:
    name: docs
    url: $CI_PAGES_URL
